name: ci

# Every push and every pull request. There was no CI at all until the first
# release was being prepared, which meant 198 tests that ran only when someone
# remembered to run them — fine for one person, useless the moment a change
# arrives from anyone else.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A second push supersedes the first; there is no value in finishing a run
  # for a commit nobody will ship.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Matches engines.node. kandy uses node:sqlite, which is not in 20.
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # One command: turbo orders them and builds each package's dependencies
      # first, which is also what proves the workspace graph is honest.
      - run: pnpm turbo run typecheck lint test build

      # The release path, exercised on every commit rather than discovered on
      # release day: the exact file a person installs, installed the way the
      # docs say, into a prefix with nothing else in it.
      - name: the release tarball installs and serves the board
        run: |
          set -euo pipefail
          node scripts/release.mjs --no-build
          out="$(mktemp -d)"
          npm i -g --silent --prefix "$out/prefix" ./release/kandy.tgz

          # The board has to be inside the package. It was not, and the failure
          # was invisible in the repo because a sibling path happened to resolve.
          test -f "$out"/prefix/lib/node_modules/kandy/dist/web/index.html

          XDG_STATE_HOME="$out/state" "$out/prefix/bin/kandy" serve --port 4911 &
          for _ in $(seq 1 30); do
            curl -sf localhost:4911/health >/dev/null && break || sleep 1
          done
          curl -sf localhost:4911/health
          curl -sf localhost:4911/ | grep -q "<title>kandy</title>"
          kill %1

  # The hub image, built and run. The first local build shipped an empty
  # dist: `**/dist` was ignored but `*.tsbuildinfo` was not, so tsc decided
  # everything was up to date and emitted nothing. Only building it catches
  # that, and only running it proves it serves.
  hub-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t kandy-hub .
      - name: the image serves the board, and runs nothing
        run: |
          set -euo pipefail
          docker run -d --name kh kandy-hub
          for _ in $(seq 1 30); do
            docker exec kh node -e "fetch('http://127.0.0.1:4477/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))" && break || sleep 1
          done
          docker exec kh node -e "fetch('http://127.0.0.1:4477/').then(r=>r.text()).then(t=>process.exit(t.includes('<title>kandy</title>')?0:1))"
          test "$(docker exec kh whoami)" = node
          # No agent and no git: a hub that cannot run them cannot be asked to.
          ! docker exec kh sh -c 'command -v claude || command -v codex || command -v cursor-agent || command -v git'
          # Identity on a public bind is the one misconfiguration that hands the hub to anyone.
          ! docker run --rm -e KANDY_IDENTITY=tailscale -e KANDY_TAILNET_HOST=h.ts.net -e KANDY_BIND=0.0.0.0 kandy-hub
